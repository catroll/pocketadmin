# PocketAdmin configuration.
#
# Every key is optional and the values below are the built-in defaults. Copy
# this file to "pocketadmin.yaml" (or point -config / POCKETADMIN_CONFIG at it)
# to override them.
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  environment variables  <  command-line flags
#
# Unknown keys are rejected at startup so that a typo fails loudly instead of
# being silently ignored.

# TCP address the HTTP server listens on.
addr: 127.0.0.1:8090

# Brand name shown in the sidebar, page titles, the login page and the footer.
#
# This is owned by this configuration on purpose. It does NOT read PocketBase's
# own Meta.AppName setting, because that value is stored in the (git-ignored)
# data directory: a fresh deployment would then display PocketBase's factory
# default, "Acme", and the brand could not be version-controlled.
appName: PocketAdmin

# PocketBase data directory. The SQLite database, uploaded files and the
# generated session signing key all live here.
dataDir: ./pb_data

# Default number of records per page in record listings (1-500).
perPage: 30

# Mark the session cookie as HTTPS-only. Enable this whenever the panel is
# served over TLS.
secureCookie: false

# Where the local storage driver keeps library file bytes. Relative paths are
# resolved against dataDir. Empty means a "storage" directory inside dataDir,
# which is where the bytes belong by default: beside the database that indexes
# them.
storageDir: ""

# Largest accepted upload, in bytes. The storage module refuses anything larger
# before writing it.
#
# These two upload settings belong to the settings module in the specification
# and are read from configuration until that module exists (see docs/decisions.md
# D-012). They will move to the settings screens without changing the storage
# code.
uploadMaxSize: 33554432

# Upload allow-list, matched against the extension derived from the content
# sniffed out of the file -- never against the name the client sent. An empty
# list means the built-in default.
uploadAllowedExtensions: []

# Enable PocketBase dev mode (verbose SQL and HTTP logging).
dev: false

# Application logging. One JSON object per line on stdout.
log:
  # debug | info | warn | error
  level: info

  # json | text
  format: json

# Integration credentials are encrypted with this key before they are stored, and
# are never returned to the browser. It must be a valid AES length: 16, 24 or 32
# bytes. PocketBase refuses to start with any other length, which is deliberate.
#
# Without it the platform refuses to store credentials at all rather than keeping
# them in clear: a silent downgrade is how a payment provider's key ends up
# readable by anyone with the database.
#
# POCKETBASE_ENCRYPTION_KEY: change-me-to-32-bytes-exactly!!
