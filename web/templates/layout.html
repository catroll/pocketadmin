{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} &middot; {{.AppName}}</title>
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/overlayscrollbars/css/OverlayScrollbars.min.css">
  <link rel="stylesheet" href="/static/vendor/toastr/toastr.min.css">
  <link rel="stylesheet" href="/static/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  {{template "navbar" .}}

  {{template "sidebar" .}}

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">{{.Title}}</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
              <li class="breadcrumb-item active">{{.Title}}</li>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid">
        {{template "flash" .}}
        {{template "content" .}}
      </div>
    </section>
  </div>

  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline">Panel {{.PanelVer}}</div>
    <strong>{{.AppName}}</strong> &middot; powered by PocketBase {{.PBVersion}}
  </footer>
</div>

<script src="/static/vendor/jquery/jquery.min.js"></script>
<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/overlayscrollbars/js/jquery.overlayScrollbars.min.js"></script>
<script src="/static/vendor/adminlte/js/adminlte.min.js"></script>
<script src="/static/vendor/chartjs/Chart.min.js"></script>
<script src="/static/vendor/toastr/toastr.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>{{end}}
