{{define "layout"}}<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} &middot; {{.AppName}}</title>
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
<div class="app-wrapper">

  {{template "navbar" .}}

  {{template "sidebar" .}}

  <main class="app-main">
    <div class="app-content-header">
      <div class="container-fluid">
        <div class="row">
          <div class="col-sm-6">
            <h3 class="mb-0">{{.Title}}</h3>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-end">
              <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">{{.Title}}</li>
            </ol>
          </div>
        </div>
      </div>
    </div>

    <div class="app-content">
      <div class="container-fluid">
        {{template "flash" .}}
        {{template "content" .}}
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="float-end d-none d-sm-inline">Panel {{.PanelVer}}</div>
    <strong>{{.AppName}}</strong> &middot; powered by PocketBase {{.PBVersion}}
  </footer>
</div>

<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/adminlte/js/adminlte.min.js"></script>
<script src="/static/vendor/chartjs/chart.umd.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>{{end}}
