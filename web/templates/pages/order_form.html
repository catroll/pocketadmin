{{define "content"}}
<form method="post" action="/orders/create">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="row">
    <div class="col-lg-8">
      <div class="card card-primary card-outline">
        <div class="card-header">
          <h3 class="card-title">{{.T "common.items"}}</h3>
          <div class="card-tools small text-body-secondary">
            {{.T "orders.form.itemsNote"}}
          </div>
        </div>
        <div class="card-body">
          {{range $i := (loop 5)}}
          <div class="row g-2 mb-2 align-items-end">
            <div class="col-sm-6">
              <label class="form-label small">{{$.T "orders.form.product"}}</label>
              <select class="form-select form-select-sm" name="product">
                <option value="">&mdash;</option>
                {{range $.Products}}
                <option value="{{.ID}}" data-price="{{.PriceText}}">{{.Name}} &mdash; {{.PriceText}}</option>
                {{end}}
              </select>
            </div>
            <div class="col-sm-4">
              <label class="form-label small">{{$.T "orders.form.variant"}}</label>
              <select class="form-select form-select-sm" name="variant">
                <option value="">{{$.T "common.default"}}</option>
                {{range $.Products}}{{range .Variants}}
                <option value="{{.ID}}">{{.Label}}{{if .SKU}} ({{.SKU}}){{end}} &mdash; {{$.T "orders.form.inStock" .Stock}}</option>
                {{end}}{{end}}
              </select>
            </div>
            <div class="col-sm-2">
              <label class="form-label small">{{$.T "orders.form.quantity"}}</label>
              <input type="number" class="form-control form-control-sm" name="quantity" min="0" value="{{if eq $i 0}}1{{end}}">
            </div>
          </div>
          {{end}}
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-header"><h3 class="card-title">{{.T "orders.form.title"}}</h3></div>
        <div class="card-body">
          <div class="mb-2">
            <label class="form-label small" for="email">{{.T "orders.form.accountEmail"}}</label>
            <input type="email" class="form-control form-control-sm" id="email" name="email" required>
          </div>
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label small" for="shippingFee">{{.T "orders.shipping"}}</label>
              <input type="text" class="form-control form-control-sm" id="shippingFee" name="shippingFee" placeholder="0.00">
            </div>
            <div class="col-6">
              <label class="form-label small" for="taxRate">{{.T "orders.form.taxPercent"}}</label>
              <input type="text" class="form-control form-control-sm" id="taxRate" name="taxRate" placeholder="0">
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label small" for="customerNote">{{.T "common.customerNote"}}</label>
            <textarea class="form-control form-control-sm" id="customerNote" name="customerNote" rows="2"></textarea>
          </div>
          <div class="form-text">
            {{.T "orders.form.pricingNote"}}
          </div>
        </div>
        <div class="card-footer d-grid">
          <button class="btn btn-primary"><i class="fas fa-save me-1"></i>{{.T "orders.form.create"}}</button>
        </div>
      </div>
    </div>
  </div>
</form>
{{end}}
