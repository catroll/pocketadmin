{{define "content"}}
<div class="login-box">
  <div class="login-logo">
    <a href="/"><b>{{.AppName}}</b></a>
  </div>

  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to the admin panel</p>

      {{if .Error}}
      <div class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle me-1"></i>{{.Error}}
      </div>
      {{end}}

      <form method="post" action="/login">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">

        <div class="input-group mb-3">
          <input type="email" name="email" class="form-control" placeholder="Email"
                 value="{{.Email}}" autocomplete="username" required autofocus>
          <span class="input-group-text"><span class="fas fa-envelope"></span></span>
        </div>

        <div class="input-group mb-3">
          <input type="password" name="password" class="form-control" placeholder="Password"
                 autocomplete="current-password" required>
          <span class="input-group-text"><span class="fas fa-lock"></span></span>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>

      <p class="mt-3 mb-0 text-body-secondary small">
        Use a PocketBase superuser account. Superusers are managed from the
        <a href="/_/" target="_blank" rel="noopener">PocketBase dashboard</a>.
      </p>
    </div>
  </div>
</div>
{{end}}
