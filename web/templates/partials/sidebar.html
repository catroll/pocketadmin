{{define "sidebar"}}
<aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
  <div class="sidebar-brand">
    <a href="/dashboard" class="brand-link">
      <i class="fas fa-cubes brand-mark"></i>
      <span class="brand-text fw-light">{{.AppName}}</span>
    </a>
  </div>

  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview" role="menu" data-accordion="false">
        <li class="nav-item">
          <a href="/dashboard" class="nav-link {{if eq .Active "dashboard"}}active{{end}}">
            <i class="nav-icon fas fa-tachometer-alt"></i>
            <p>Dashboard</p>
          </a>
        </li>
        <li class="nav-item">
          <a href="/collections" class="nav-link {{if eq .Active "collections"}}active{{end}}">
            <i class="nav-icon fas fa-database"></i>
            <p>Collections</p>
          </a>
        </li>

        <li class="nav-header">COLLECTIONS</li>
        {{range .Nav}}
        <li class="nav-item">
          <a href="/collections/{{.Name}}/records"
             class="nav-link {{if eq .Name $.CurrentCollection}}active{{end}}">
            <i class="nav-icon {{if eq .Type "auth"}}fas fa-users{{else if eq .Type "view"}}fas fa-eye{{else}}far fa-circle{{end}}"></i>
            <p>
              {{.Name}}
              {{if .System}}<span class="badge text-bg-secondary rounded-pill">sys</span>{{end}}
            </p>
          </a>
        </li>
        {{end}}
      </ul>
    </nav>
  </div>
</aside>
{{end}}
