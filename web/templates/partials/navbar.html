{{define "navbar"}}
<nav class="app-header navbar navbar-expand bg-body">
  <div class="container-fluid">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" aria-label="{{.T "chrome.toggleNav"}}">
          <i class="fas fa-bars"></i>
        </a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="/dashboard" class="nav-link">{{.T "nav.dashboard"}}</a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="/collections" class="nav-link">{{.T "nav.collections"}}</a>
      </li>
    </ul>

    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="/_/" target="_blank" rel="noopener" title="PocketBase dashboard">
          <i class="fas fa-toolbox"></i>
        </a>
      </li>
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
           aria-haspopup="true" aria-expanded="false">
          <i class="far fa-user"></i>
          <span class="d-none d-md-inline ms-1">{{.UserEmail}}</span>
        </a>
        <div class="dropdown-menu dropdown-menu-end">
          <a class="dropdown-item" href="/_/" target="_blank" rel="noopener">
            <i class="fas fa-toolbox me-2"></i>PocketBase dashboard
          </a>
          <a class="dropdown-item" href="/api/health">
            <i class="fas fa-heartbeat me-2"></i>Health check
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="/preferences">
            <i class="fas fa-sliders me-2"></i>{{.T "chrome.preferences"}}
          </a>
          <div class="dropdown-divider"></div>
          <form method="post" action="/logout">
            <input type="hidden" name="_csrf" value="{{.CSRF}}">
            <button type="submit" class="dropdown-item text-danger">
              <i class="fas fa-sign-out-alt me-2"></i>{{.T "chrome.signOut"}}
            </button>
          </form>
        </div>
      </li>
    </ul>
  </div>
</nav>
{{end}}
